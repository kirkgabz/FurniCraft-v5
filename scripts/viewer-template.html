<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Foreign chair viewer</title>
<style>html,body{margin:0;height:100%;background:#2a2a2a;} canvas{display:block;}</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const W = 900, H = 700;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2a2a);

const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 10000);

scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const dir = new THREE.DirectionalLight(0xffffff, 2.0);
dir.position.set(50, 80, 50);
scene.add(dir);
const dir2 = new THREE.DirectionalLight(0xffffff, 1.0);
dir2.position.set(-50, 30, -50);
scene.add(dir2);

const grid = new THREE.GridHelper(200, 20);
scene.add(grid);

window.__status = "loading";

const base64 = "__GLB_BASE64__";
function base64ToArrayBuffer(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

const loader = new GLTFLoader();
loader.parse(base64ToArrayBuffer(base64), "", (gltf) => {
  const model = gltf.scene;

  // Color by the ORIGINAL material identity (GLTFLoader shares one Material
  // instance across every mesh that referenced the same glTF material
  // index), not by mesh order -- so "material 17" and "material 21" each
  // get one consistent color regardless of how many shells they split into.
  const palette = [0xff6b6b, 0x4dabf7, 0x69db7c, 0xffd43b, 0xda77f2, 0xff922b];
  const colorByMaterial = new Map();
  window.__meshInfo = [];
  model.traverse((obj) => {
    if (!obj.isMesh) return;
    const key = obj.material?.uuid ?? "none";
    if (!colorByMaterial.has(key)) colorByMaterial.set(key, palette[colorByMaterial.size % palette.length]);
    const color = colorByMaterial.get(key);
    window.__meshInfo.push({ name: obj.name, originalMaterialUuid: key, color: "#" + color.toString(16).padStart(6, "0") });
    obj.material = new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.05 });
  });

  scene.add(model);

  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);

  camera.position.set(center.x + maxDim * 1.1, center.y + maxDim * 0.7, center.z + maxDim * 1.4);
  camera.lookAt(center);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(center);
  controls.update();

  renderer.render(scene, camera);
  window.__status = "ready";
  window.__bbox = { min: box.min.toArray(), max: box.max.toArray(), size: size.toArray() };
}, (err) => {
  window.__status = "error";
  window.__error = String(err);
});

window.__render = () => renderer.render(scene, camera);
window.__camera = camera;
window.__controls_target = () => scene;
</script>
</body>
</html>
